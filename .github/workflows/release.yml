# Publishes uploadshield to PyPI when a version tag (v2.0.0, v2.1.0, ...) is pushed.
#
# PyPI trusts this workflow directly (trusted publishing), so no token is stored
# anywhere. The PyPI publisher is registered for this file name (release.yml) and
# the "pypi" environment: renaming either one stops publishing.
#
# Run it by hand (Actions > Release > Run workflow) to rehearse a release: that
# runs the tests and builds and smoke-tests the package, but never publishes.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

# One release run at a time, and never cancel one that may be uploading.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        # The oldest supported version and the development version.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Check the tag matches the package version
        if: github.ref_type == 'tag'
        run: test "${GITHUB_REF_NAME#v}" = "$(uv version --short)"
      - name: Run the tests
        run: uv run --locked --all-extras pytest -q

  build:
    name: Build and smoke-test
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.13"
          enable-cache: false
      - name: Build the sdist and the wheel
        # uv builds the wheel from the sdist, so this also proves the sdist is complete.
        run: uv build --no-sources
      - name: Smoke-test the wheel
        run: |
          wheel=$(ls dist/*.whl)
          shield() { uv run --isolated --no-project --with "$wheel" uploadshield "$@"; }
          test "$(shield --version)" = "uploadshield $(uv version --short)"
          shield policies > /dev/null
          # A PHP script disguised as an image must be reported as dangerous (exit 1).
          printf '<?php system($_GET["c"]); ?>' > "$RUNNER_TEMP/shell.png"
          status=0
          shield scan "$RUNNER_TEMP/shell.png" || status=$?
          test "$status" -eq 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    # Only a pushed tag publishes; a manual run stops after the build.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/uploadshield/
    permissions:
      id-token: write # lets PyPI verify that this workflow is the publisher
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
