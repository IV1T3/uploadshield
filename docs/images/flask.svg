<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="t d">
  <title id="t">Flask: uploads are validated before the view runs</title>
  <desc id="d">UploadShield registers a before_request hook. It reads request.files, so Werkzeug parses the whole body first, capped by MAX_CONTENT_LENGTH. The hook picks the view's policy, validates and sanitizes every file and replaces request.files, so the view receives sanitized files. A refusal raises UploadRejected, a Werkzeug HTTP error answered with 400, 413 or 415.</desc>
  <style>
svg { --bg:#ffffff; --fg:#1f2328; --muted:#59636e; --line:#818b98; --panel:#f6f8fa;
  --panel-edge:#d1d9e0; --accent:#0969da; --accent-soft:#ddf4ff; --accent-edge:#54aeff;
  --ok:#1a7f37; --ok-soft:#dafbe1; --bad:#cf222e; --bad-soft:#ffebe9; --note:#fff8c5;
  --note-edge:#d4a72c; }
@media (prefers-color-scheme: dark) {
  svg { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --line:#7d8590; --panel:#151b23;
    --panel-edge:#3d444d; --accent:#4493f8; --accent-soft:#0d2240; --accent-edge:#1f6feb;
    --ok:#3fb950; --ok-soft:#0f2a1a; --bad:#f85149; --bad-soft:#2d1316; --note:#2b2410;
    --note-edge:#9e6a03; }
}
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica,
  Arial, sans-serif; fill: var(--fg); }
.card { fill: var(--bg); stroke: var(--panel-edge); }
.title { font-size: 14px; font-weight: 600; }
.label { font-size: 13px; }
.small { font-size: 12px; fill: var(--muted); }
.lane { font-size: 11px; font-weight: 600; letter-spacing: .08em; fill: var(--muted); }
.mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  font-size: 12px; }
.panel { fill: var(--panel); stroke: var(--panel-edge); }
.shield { fill: var(--accent-soft); stroke: var(--accent-edge); }
.shield-title { fill: var(--accent); font-size: 14px; font-weight: 600; }
.step { fill: var(--bg); stroke: var(--accent-edge); }
.num { fill: var(--accent); }
.num-text { fill: var(--bg); font-size: 11px; font-weight: 700; }
.ok-box { fill: var(--ok-soft); stroke: var(--ok); }
.bad-box { fill: var(--bad-soft); stroke: var(--bad); }
.note { fill: var(--note); stroke: var(--note-edge); }
.wire { fill: none; stroke: var(--line); stroke-width: 1.5; }
.wire-accent { fill: none; stroke: var(--accent); stroke-width: 1.5; }
.wire-ok { fill: none; stroke: var(--ok); stroke-width: 1.75; }
.wire-bad { fill: none; stroke: var(--bad); stroke-width: 1.5; stroke-dasharray: 5 4; }
.wire-return { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 4 3; }
.boundary { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 4; }
.lifeline { fill: none; stroke: var(--panel-edge); stroke-width: 1.5; stroke-dasharray: 3 4; }
.activation { fill: var(--accent-soft); stroke: var(--accent-edge); }
.head-line { fill: var(--line); }
.head-accent { fill: var(--accent); }
.head-ok { fill: var(--ok); }
.head-bad { fill: var(--bad); }
.halo { paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
.ok-text { fill: var(--ok); }
.bad-text { fill: var(--bad); }
</style>
  <defs><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-line" d="M0 0 L10 5 L0 10 z"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-accent" d="M0 0 L10 5 L0 10 z"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-ok" d="M0 0 L10 5 L0 10 z"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-bad" d="M0 0 L10 5 L0 10 z"/></marker></defs>
  <rect x="0.5" y="0.5" width="899" height="499" rx="12" class="card"/>
  <rect x="20.0" y="20" width="120" height="52" rx="8" class="panel"/>
  <text x="80.0" y="42.0" class="title" text-anchor="middle">Client</text>
  <text x="80.0" y="60.0" class="small" text-anchor="middle">browser / API</text>
  <rect x="195.0" y="20" width="190" height="52" rx="8" class="panel"/>
  <text x="290.0" y="42.0" class="title" text-anchor="middle">Flask / Werkzeug</text>
  <text x="290.0" y="60.0" class="small" text-anchor="middle">request parsing</text>
  <rect x="430.0" y="20" width="230" height="52" rx="8" class="shield"/>
  <text x="545.0" y="42.0" class="shield-title" text-anchor="middle">UploadShield</text>
  <text x="545.0" y="60.0" class="small" text-anchor="middle">before_request hook</text>
  <rect x="725.0" y="20" width="150" height="52" rx="8" class="panel"/>
  <text x="800.0" y="42.0" class="title" text-anchor="middle">Your view</text>
  <text x="800.0" y="60.0" class="small" text-anchor="middle">@validate_uploads(…)</text>
  <path d="M80 72 L80 480" class="lifeline"/>
  <path d="M290 72 L290 480" class="lifeline"/>
  <path d="M545 72 L545 480" class="lifeline"/>
  <path d="M800 72 L800 480" class="lifeline"/>
  <rect x="538" y="130" width="14" height="250" rx="3" class="activation"/>
  <path d="M80 104 L288 104" class="wire" marker-end="url(#arrow-line)"/>
  <text x="185.0" y="97" class="label halo" text-anchor="middle">multipart body</text>
  <path d="M290 140 L543 140" class="wire" marker-end="url(#arrow-line)"/>
  <text x="417.5" y="133" class="mono halo" text-anchor="middle">before_request</text>
  <path d="M545 176 L292 176" class="wire" marker-end="url(#arrow-line)"/>
  <text x="417.5" y="169" class="mono halo" text-anchor="middle">request.files</text>
  <rect x="195" y="188" width="190" height="46" rx="6" class="note"/>
  <text x="205" y="209" class="small" text-anchor="start">parses the whole body;</text>
  <text x="205" y="226" class="small" text-anchor="start">MAX_CONTENT_LENGTH → 413</text>
  <path d="M290 256 L543 256" class="wire-return" marker-end="url(#arrow-line)"/>
  <text x="417.5" y="249" class="mono halo" text-anchor="middle">FileStorage objects</text>
  <rect x="559" y="268" width="230" height="63" rx="6" class="note"/>
  <text x="569" y="289" class="small" text-anchor="start">policy: @validate_uploads,</text>
  <text x="569" y="306" class="small" text-anchor="start">ENDPOINT_POLICIES, default;</text>
  <text x="569" y="323" class="small" text-anchor="start">validate and sanitize</text>
  <path d="M545 380 L798 380" class="wire-ok" marker-end="url(#arrow-ok)"/>
  <text x="672.5" y="373" class="mono halo ok-text" text-anchor="middle">sanitized request.files</text>
  <path d="M545 436 L82 436" class="wire-bad" marker-end="url(#arrow-bad)"/>
  <text x="312.5" y="429" class="mono halo bad-text" text-anchor="middle">refused: UploadRejected (HTTPException) → 400 / 413 / 415</text>
</svg>
