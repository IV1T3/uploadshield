  <text x="490.0" y="57.0" class="title" text-anchor="middle">Flask app</text>
  <path d="M490 74 L490 110" class="wire" marker-end="url(#arrow-line)"/>
  <text x="498" y="97" class="small" text-anchor="start">hooks in</text>
  <rect x="380" y="112" width="220" height="82" rx="8" class="shield"/>
  <text x="490.0" y="140.0" class="shield-title mono" text-anchor="middle">uploadshield.flask</text>
  <text x="490.0" y="158.0" class="small" text-anchor="middle">extension · decorators</text>
  <text x="490.0" y="176.0" class="small" text-anchor="middle">WTForms validator</text>
  <path d="M440 194 L440 222" class="wire"/>
  <path d="M540 232 L540 197" class="wire-return" marker-end="url(#arrow-line)"/>
  <rect x="635" y="30" width="220" height="44" rx="8" class="panel"/>
  <text x="745.0" y="57.0" class="title" text-anchor="middle">FastAPI app</text>
