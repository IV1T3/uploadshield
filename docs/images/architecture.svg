  <text x="753" y="97" class="small" text-anchor="start">hooks in</text>
  <rect x="635" y="112" width="220" height="82" rx="8" class="shield"/>
  <text x="745.0" y="140.0" class="shield-title mono" text-anchor="middle">uploadshield.fastapi</text>
