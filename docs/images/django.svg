<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="t d">
  <title id="t">Django: uploads are validated while the body streams in</title>
  <desc id="d">When the CSRF check or the view first reads request.POST or request.FILES, Django's multipart parser streams the body through ValidatingUploadHandler. The name is checked before any byte is stored, size limits and the type allow-list as data arrives, and the full policy once a file is complete; the view receives the sanitized file. A refusal raises UploadRejected, which handler400 answers with 400, 413 or 415.</desc>
  <style>
svg { --bg:#ffffff; --fg:#1f2328; --muted:#59636e; --line:#818b98; --panel:#f6f8fa;
  --panel-edge:#d1d9e0; --accent:#0969da; --accent-soft:#ddf4ff; --accent-edge:#54aeff;
  --ok:#1a7f37; --ok-soft:#dafbe1; --bad:#cf222e; --bad-soft:#ffebe9; --note:#fff8c5;
  --note-edge:#d4a72c; }
@media (prefers-color-scheme: dark) {
  svg { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --line:#7d8590; --panel:#151b23;
    --panel-edge:#3d444d; --accent:#4493f8; --accent-soft:#0d2240; --accent-edge:#1f6feb;
    --ok:#3fb950; --ok-soft:#0f2a1a; --bad:#f85149; --bad-soft:#2d1316; --note:#2b2410;
    --note-edge:#9e6a03; }
}
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica,
  Arial, sans-serif; fill: var(--fg); }
.card { fill: var(--bg); stroke: var(--panel-edge); }
.title { font-size: 14px; font-weight: 600; }
.label { font-size: 13px; }
.small { font-size: 12px; fill: var(--muted); }
.lane { font-size: 11px; font-weight: 600; letter-spacing: .08em; fill: var(--muted); }
.mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  font-size: 12px; }
.panel { fill: var(--panel); stroke: var(--panel-edge); }
.shield { fill: var(--accent-soft); stroke: var(--accent-edge); }
.shield-title { fill: var(--accent); font-size: 14px; font-weight: 600; }
.step { fill: var(--bg); stroke: var(--accent-edge); }
.num { fill: var(--accent); }
.num-text { fill: var(--bg); font-size: 11px; font-weight: 700; }
.ok-box { fill: var(--ok-soft); stroke: var(--ok); }
.bad-box { fill: var(--bad-soft); stroke: var(--bad); }
.note { fill: var(--note); stroke: var(--note-edge); }
.wire { fill: none; stroke: var(--line); stroke-width: 1.5; }
.wire-accent { fill: none; stroke: var(--accent); stroke-width: 1.5; }
.wire-ok { fill: none; stroke: var(--ok); stroke-width: 1.75; }
.wire-bad { fill: none; stroke: var(--bad); stroke-width: 1.5; stroke-dasharray: 5 4; }
.wire-return { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 4 3; }
.boundary { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 4; }
.lifeline { fill: none; stroke: var(--panel-edge); stroke-width: 1.5; stroke-dasharray: 3 4; }
.activation { fill: var(--accent-soft); stroke: var(--accent-edge); }
.head-line { fill: var(--line); }
.head-accent { fill: var(--accent); }
.head-ok { fill: var(--ok); }
.head-bad { fill: var(--bad); }
.halo { paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
.ok-text { fill: var(--ok); }
.bad-text { fill: var(--bad); }
</style>
  <defs><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-line" d="M0 0 L10 5 L0 10 z"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-accent" d="M0 0 L10 5 L0 10 z"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-ok" d="M0 0 L10 5 L0 10 z"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-bad" d="M0 0 L10 5 L0 10 z"/></marker></defs>
  <rect x="0.5" y="0.5" width="899" height="599" rx="12" class="card"/>
  <rect x="20.0" y="20" width="120" height="52" rx="8" class="panel"/>
  <text x="80.0" y="42.0" class="title" text-anchor="middle">Client</text>
  <text x="80.0" y="60.0" class="small" text-anchor="middle">browser / API</text>
  <rect x="175.0" y="20" width="170" height="52" rx="8" class="panel"/>
  <text x="260.0" y="42.0" class="title" text-anchor="middle">Django parser</text>
  <text x="260.0" y="60.0" class="small" text-anchor="middle">MultiPartParser</text>
  <rect x="365.0" y="20" width="210" height="52" rx="8" class="shield"/>
  <text x="470.0" y="42.0" class="shield-title" text-anchor="middle">ValidatingUploadHandler</text>
  <text x="470.0" y="60.0" class="small" text-anchor="middle">the view's policy</text>
  <rect x="590.0" y="20" width="150" height="52" rx="8" class="panel"/>
  <text x="665.0" y="42.0" class="title" text-anchor="middle">Storage handlers</text>
  <text x="665.0" y="60.0" class="small" text-anchor="middle">memory or temp file</text>
  <rect x="765.0" y="20" width="130" height="52" rx="8" class="panel"/>
  <text x="830.0" y="42.0" class="title" text-anchor="middle">Your view</text>
  <text x="830.0" y="60.0" class="small" text-anchor="middle">or CSRF middleware</text>
  <path d="M80 72 L80 580" class="lifeline"/>
  <path d="M260 72 L260 580" class="lifeline"/>
  <path d="M470 72 L470 580" class="lifeline"/>
  <path d="M665 72 L665 580" class="lifeline"/>
  <path d="M830 72 L830 580" class="lifeline"/>
  <rect x="463" y="160" width="14" height="306" rx="3" class="activation"/>
  <path d="M830 102 L262 102" class="wire" marker-end="url(#arrow-line)"/>
  <text x="545.0" y="95" class="mono halo" text-anchor="middle">reads request.POST / FILES</text>
  <path d="M80 138 L258 138" class="wire" marker-end="url(#arrow-line)"/>
  <text x="170.0" y="131" class="label halo" text-anchor="middle">multipart body, in chunks</text>
  <path d="M260 172 L468 172" class="wire" marker-end="url(#arrow-line)"/>
  <text x="365.0" y="165" class="mono halo" text-anchor="middle">new_file(name, …)</text>
  <rect x="484" y="184" width="262" height="46" rx="6" class="note"/>
  <text x="494" y="205" class="small" text-anchor="start">name checked first: a refused name</text>
  <text x="494" y="222" class="small" text-anchor="start">means nothing is ever stored</text>
  <path d="M260 254 L468 254" class="wire" marker-end="url(#arrow-line)"/>
  <text x="365.0" y="247" class="mono halo" text-anchor="middle">receive_data_chunk(chunk)</text>
  <rect x="484" y="266" width="262" height="46" rx="6" class="note"/>
  <text x="494" y="287" class="small" text-anchor="start">size limits on every chunk;</text>
  <text x="494" y="304" class="small" text-anchor="start">type allow-list after the first 8 KiB</text>
  <path d="M470 336 L663 336" class="wire" marker-end="url(#arrow-line)"/>
  <text x="567.5" y="329" class="mono halo" text-anchor="middle">chunk, if still allowed</text>
  <path d="M260 376 L468 376" class="wire" marker-end="url(#arrow-line)"/>
  <text x="365.0" y="369" class="mono halo" text-anchor="middle">file_complete()</text>
  <rect x="484" y="388" width="262" height="46" rx="6" class="note"/>
  <text x="494" y="409" class="small" text-anchor="start">full policy: macros, bombs, …</text>
  <text x="494" y="426" class="small" text-anchor="start">then sanitize (re-encode, rename)</text>
  <path d="M470 456 L262 456" class="wire-return" marker-end="url(#arrow-line)"/>
  <text x="365.0" y="449" class="mono halo" text-anchor="middle">sanitized file</text>
  <path d="M260 496 L828 496" class="wire-ok" marker-end="url(#arrow-ok)"/>
  <text x="545.0" y="489" class="mono halo ok-text" text-anchor="middle">request.FILES: sanitized, detected types</text>
  <path d="M470 546 L82 546" class="wire-bad" marker-end="url(#arrow-bad)"/>
  <text x="275.0" y="539" class="mono halo bad-text" text-anchor="middle">refused: UploadRejected → handler400 → 400/413/415</text>
</svg>
